name: OceanStudio CI/CD Build & Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK & AAB Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradle
        run: chmod +x OceanStudio/gradlew || true

      - name: Build Debug & Release APKs and AAB Bundle
        run: |
          cd OceanStudio
          chmod +x ../gradle/gradle-8.5/bin/gradle || true
          gradle assembleDebug assembleRelease bundleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: oceanstudio-debug-apk
          path: OceanStudio/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: oceanstudio-release-apk
          path: OceanStudio/app/build/outputs/apk/release/app-release.apk

      - name: Upload Release AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: oceanstudio-release-aab
          path: OceanStudio/app/build/outputs/bundle/release/app-release.aab

      - name: Create Production Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: OceanStudio v1.0.0 Release (Build #${{ github.run_number }})
          body: |
            ## 🌊 OceanStudio Production Release v1.0.0
            
            Native Android IDE & POSIX Terminal Environment (`oceanstudio.ai`).
            
            ### 📦 Included Release Binaries:
            - **`app-debug.apk`**: Debug Build for testing & side-loading.
            - **`app-release.apk`**: Signed Production Release APK.
            - **`app-release.aab`**: Google Play Store App Bundle.
            
            ### 🔥 Features Included:
            - Native C++ PTY Pseudo-Terminal Engine (`openpty`, `forkpty`).
            - User-Space POSIX Sandbox (`/data/data/oceanstudio.ai/files/usr`).
            - Firebase Android Auth (Email/Password, Native Google Sign-In, GitHub OAuth).
            - Custom Canvas White Studio Terminal View with pinch-to-zoom & soft key action bar.
            - Foreground Keep-Alive CPU WakeLock Service.
          files: |
            OceanStudio/app/build/outputs/apk/debug/app-debug.apk
            OceanStudio/app/build/outputs/apk/release/app-release.apk
            OceanStudio/app/build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
