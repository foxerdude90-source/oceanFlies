name: OceanStudio CI/CD Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Publish Release Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          chmod +x OceanStudio/gradlew

      - name: Build Debug & Release APKs and AAB Bundle
        run: |
          cd OceanStudio
          ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: OceanStudio/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: OceanStudio/app/build/outputs/apk/release/app-release.apk

      - name: Upload Release AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: OceanStudio/app/build/outputs/bundle/release/app-release.aab

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && 'v1.0.0-latest' || github.ref_name }}
          name: OceanStudio Release (${{ github.ref_name == 'main' && 'v1.0.0 Latest' || github.ref_name }})
          draft: false
          prerelease: false
          make_latest: 'true'
          body: |
            ## 🌊 OceanStudio Production Release (`oceanstudio.ai`)
            
            Native Android IDE & POSIX Terminal Environment.
            
            ### 📦 Direct Install Download Binaries:
            - **`app-release.apk`**: Production Signed Release APK ready for direct side-loading on Android.
            - **`app-debug.apk`**: Debug Build for testing.
            - **`app-release.aab`**: Google Play Store App Bundle.
          files: |
            OceanStudio/app/build/outputs/apk/debug/app-debug.apk
            OceanStudio/app/build/outputs/apk/release/app-release.apk
            OceanStudio/app/build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
